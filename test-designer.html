<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест ProductTypeDesignerUI</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/product-type-designer.css">
</head>
<body>
    <div id="app">
        <div style="padding: 20px;">
            <h1>Тест ProductTypeDesignerUI</h1>
            <button id="test-btn" class="btn btn-primary">
                🎨 Открыть конструктор типов изделий
            </button>
        </div>
    </div>
    
    <!-- Подключаем все зависимости -->
    <script src="js/constants/UserRole.js"></script>
    <script src="js/constants/OrderStatus.js"></script>
    <script src="js/constants/FieldTypes.js"></script>
    
    <script src="js/domain/entities/Entity.js"></script>
    <script src="js/domain/value-objects/UserPermissions.js"></script>
    <script src="js/domain/value-objects/ValidationResult.js"></script>
    <script src="js/domain/value-objects/ProcessStep.js"></script>
    <script src="js/domain/value-objects/ProcessFlow.js"></script>
    <script src="js/domain/value-objects/FieldValue.js"></script>
    <script src="js/domain/entities/CustomField.js"></script>
    <script src="js/domain/entities/User.js"></script>
    <script src="js/domain/entities/Process.js"></script>
    <script src="js/domain/entities/ProductType.js"></script>
    <script src="js/domain/entities/Order.js"></script>
    
    <script src="js/infrastructure/repositories/Repository.js"></script>
    <script src="js/infrastructure/repositories/LocalStorageRepository.js"></script>
    <script src="js/infrastructure/factories/RepositoryFactory.js"></script>
    
    <script src="js/application/builders/FormBuilder.js"></script>
    <script src="js/ui/ProductTypeDesignerUI.js"></script>
    
    <script src="js/application/services/UserService.js"></script>
    <script src="js/application/services/ProcessService.js"></script>
    <script src="js/application/services/ProductTypeService.js"></script>
    <script src="js/application/services/OrderService.js"></script>
    <script src="js/application/services/AdminService.js"></script>
    
    <script src="js/application/ApplicationContext.js"></script>
    
    <script>
        // Глобальные переменные
        let app = null;
        let designer = null;
        
        // Простые утилиты
        function showError(message) {
            alert('Ошибка: ' + message);
        }
        
        function showSuccess(message) {
            alert('Успех: ' + message);
        }
        
        // Инициализация
        async function init() {
            try {
                // Создаем контекст приложения
                app = new ApplicationContext();
                await app.initialize();
                
                // Создаем тестового администратора
                await app.userService.createUser({
                    name: 'Тест Админ',
                    role: 'ADMINISTRATOR'
                });
                
                // Авторизуем
                await app.authenticate('Тест Админ');
                
                // Создаем несколько тестовых процессов
                await app.processService.createProcess({
                    name: 'Прием заказа',
                    description: 'Первоначальный прием и регистрация заказа',
                    order: 1
                });
                
                await app.processService.createProcess({
                    name: 'Подготовка материалов',
                    description: 'Закупка и подготовка необходимых материалов',
                    order: 2
                });
                
                await app.processService.createProcess({
                    name: 'Производство',
                    description: 'Основной процесс изготовления',
                    order: 3
                });
                
                await app.processService.createProcess({
                    name: 'Контроль качества',
                    description: 'Проверка качества готового изделия',
                    order: 4
                });
                
                await app.processService.createProcess({
                    name: 'Доставка',
                    description: 'Доставка готового изделия клиенту',
                    order: 5
                });
                
                console.log('✅ Тестовое окружение готово');
                
                // Создаем конструктор
                designer = new ProductTypeDesignerUI(app);
                
                // Настраиваем обработчики
                designer.onProductTypeSaved = (productType) => {
                    console.log('✅ Тип изделия сохранен:', productType);
                    showSuccess(`Тип изделия "${productType.name}" успешно создан!`);
                };
                
                designer.onProductTypeCancelled = () => {
                    console.log('🙅 Создание отменено');
                };
                
                // Привязываем к кнопке
                document.getElementById('test-btn').onclick = () => {
                    designer.show();
                };
                
                // Глобальная переменная для onclick обработчиков
                window.productTypeDesigner = designer;
                
                console.log('🎯 Тест готов к запуску!');
                
            } catch (error) {
                console.error('❌ Ошибка инициализации:', error);
                showError('Ошибка инициализации: ' + error.message);
            }
        }
        
        // Запуск при загрузке
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
